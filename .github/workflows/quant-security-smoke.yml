name: Quant Security Smoke Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests cryptography firebase-admin
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run security self-test
        run: python security_selftest.py
